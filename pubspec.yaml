name: barberos
description: BarberOS - Gestão profissional para barbearias
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_app_check: ^0.3.1
  firebase_crashlytics: ^4.1.3

  # Local DB
  sqflite_sqlcipher: ^2.2.1
  sqflite_common_ffi: ^2.3.4

  # State management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2

  # Export
  pdf: ^3.11.1
  printing: ^5.13.1
  csv: ^6.0.0
  excel: ^4.0.6

  # Sharing / Connectivity
  share_plus: ^10.0.3
  connectivity_plus: ^6.1.0

  # Payments / Web
  webview_flutter: ^4.10.0
  http: ^1.2.2

  # Security
  flutter_secure_storage: ^9.2.2

  # Media
  image_picker: ^1.1.2

  # Utils
  intl: ^0.19.0
  crypto: ^3.0.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
